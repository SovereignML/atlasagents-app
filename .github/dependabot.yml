# Dependabot version updates. npm minor and patch bumps arrive as one grouped
# PR a week; a major bump gets its own PR. CI runs on each, including the
# critical-advisory audit.
#
# Per-advisory security PRs are a separate switch: "Dependabot security
# updates" in the repo's Settings → Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint (via eslint-config-next) supports TypeScript < 6.1, and
      # lint fails outright on TypeScript 7 ("typescript-eslint does not support
      # TS 7.0"). package.json pins ~6.0.3 for the same reason. Lift this once a
      # typescript-eslint release supports newer TypeScript.
      - dependency-name: typescript
        versions: [">= 6.1.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
